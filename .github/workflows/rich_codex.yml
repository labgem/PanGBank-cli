name: Rich-codex
on:
  # Run when changes are pushed to main branch (e.g., when PRs are merged)
  push:
    branches:
      - main
    paths:
      - "README.md"
      - pangbank_cli/*.py
  # Run when a PR is closed and merged into main
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - "README.md"
      - pangbank_cli/*.py
  # Allow manual workflow trigger
  workflow_dispatch:

jobs:
  rich_codex:
    # Only run if it's a direct push to main, a merged PR, or manually triggered
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      contains(github.event.head_commit.message, '[screenshots]')
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "true"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Install your custom tools
        run: pip install .

      - name: Generate terminal images with rich-codex
        uses: ewels/rich-codex@v1
        with:
          commit_changes: "true"