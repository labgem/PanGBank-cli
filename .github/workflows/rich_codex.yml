name: Rich-codex
on:
  # Run when changes are pushed to main branch (e.g., when PRs are merged)
  push:
    branches:
      - main
    paths:
      - "README.md"
      - pangbank_cli/*.py
  # Allow manual workflow trigger
  workflow_dispatch:

jobs:
  rich_codex:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "true"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Install your custom tools
        run: pip install .

      - name: Generate terminal images with rich-codex
        uses: ewels/rich-codex@v1
        with:
          commit_changes: "true"