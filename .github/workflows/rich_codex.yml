name: Rich-codex
on:
  # Run when changes are pushed to any branch
  push:
  # Allow manual workflow trigger
  workflow_dispatch:

jobs:
  rich_codex:
    # Run if: manual trigger or commit message contains [screenshots]
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[screenshots]')
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "true"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Install your custom tools
        run: pip install .

      - name: Generate terminal images with rich-codex
        uses: ewels/rich-codex@v1
        with:
          commit_changes: "true"