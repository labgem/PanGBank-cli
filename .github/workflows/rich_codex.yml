name: Rich-codex
on:
  # Run when changes are pushed to any branch
  push:
  # Run when a PR is closed and merged into main
  pull_request:
    types: [closed]
    branches:
      - main
  # Allow manual workflow trigger
  workflow_dispatch:

jobs:
  rich_codex:
    # Run if: manual trigger, commit has [screenshots], on main branch, or merged PR to main
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[screenshots]') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "true"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Install your custom tools
        run: pip install .

      - name: Generate terminal images with rich-codex
        uses: ewels/rich-codex@v1
        with:
          commit_changes: "true"