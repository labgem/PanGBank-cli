name: Lint and type check

on: [push, pull_request]

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10" # lowest supported version, same as pyright's pythonVersion

      - name: Install PanGBank-cli with dev dependencies
        run: pip install -e '.[dev]'

      - name: Run pre-commit hooks (ruff, pyright strict, file checks)
        run: prek run --all-files --show-diff-on-failure
