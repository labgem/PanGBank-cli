# Run with prek (fast, drop-in replacement for pre-commit) or pre-commit:
#   pip install -e '.[dev]'
#   prek install            # run the hooks on every `git commit`
#   prek run --all-files    # run them by hand on the whole repo
#
# The pyright hook uses the active Python environment (language: system) so it
# sees the same installed packages as VS Code/Pylance and the rest of the dev
# setup: activate the environment where `pip install -e '.[dev]'` was run.

exclude: ^(docs/img/|LICENSE$) # rich-codex screenshots (regenerated by CI); legal text kept verbatim

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright (strict)
        entry: pyright
        language: system
        types_or: [python, pyi, toml]
        pass_filenames: false # check the whole project: a change can break callers in other files
        require_serial: true
